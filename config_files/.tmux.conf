# ── History ──────────────────────────────────────
set -g history-limit 100000

# ── Mouse ────────────────────────────────────────
# Scroll, select panes, resize panes, etc.
set -g mouse on

# ── Terminal / colors ────────────────────────────
# Better support for modern terminals / true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# ── Windows and panes ────────────────────────────
# Start numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# ── Responsiveness ───────────────────────────────
# Reduce delay after pressing Escape
set -sg escape-time 10

# ── Copy mode ────────────────────────────────────
# vi-like navigation
setw -g mode-keys vi

# ── Status bar ───────────────────────────────────
# Refresh every 30 seconds
set -g status-interval 30

# Blue status bar with bold white text
#set -g status-style 'bg=blue,fg=white,bold' # other colors 1
set -g status-style "bg=#1e242d,fg=#aab6c3"

# Inactive windows
#setw -g window-status-style 'bg=blue,fg=white,bold' # other colors1
set -g window-status-format "  #I:#W  "
set -g window-status-style "fg=#8fbcbb,bg=#1e242d"

# Active window
#setw -g window-status-current-style 'bg=white,fg=blue,bold' # other colors1
set -g window-status-current-format "  #I:#W  "
set -g window-status-current-style "fg=#eee8d5,bg=#268bd2,bold"

# Borders
set -g pane-border-style "fg=#586e75"
set -g pane-active-border-style "fg=#2aa198"

# Show current directory path, hostname and date/time on the right
#set -g status-right '#{pane_current_path} | #H | %Y-%m-%d %H:%M'
set -g status-left '#[bold] #S #[default] | #[fg=#2aa198,bold]☸ #(kubectl config current-context 2>/dev/null) #[default]'
set -g status-right '#{?pane_synchronized,#[fg=#f9e2af]⚠ SYNC ⚠ #[default],} #[fg=#d8dee9,bold]#{pane_current_path} | #H | %Y-%m-%d | %H:%M #[default]'

# Give window names more room
set -g status-left-length 60
set -g status-right-length 60

# ── Window titles ────────────────────────────────
# Automatically rename windows based on running command
setw -g automatic-rename on

# ── Activity ─────────────────────────────────────
# Highlight windows where something happened
setw -g monitor-activity on
set -g visual-activity off

# ── Synchronize panes ──────────────────────────

# Ctrl+b y → toggle synchronized input
bind y set-window-option synchronize-panes \; \
    display-message "Synchronize panes: #{?pane_synchronized,ON,OFF}"

# Ctrl+N → next window
bind -n C-n next-window

# Ctrl+P → previous window
bind -n C-p previous-window

# Pane navigation
# Shift + arrows

bind -n S-Left  select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up    select-pane -U
bind -n S-Down  select-pane -D

# -- Display tmux cheatsheet -- ctrl + /
bind -n C-_ display-popup -E -w 70 -h 60% \
    "cat ~/.config/tmux/cheatsheet | fzf --layout=reverse --border --prompt='TMUX > '"

# Ctrl+G → temporary shell popup in current directory
bind -n C-g display-popup -E \
    -w 80% \
    -h 80% \
    -d "#{pane_current_path}"


# ── Reload config ────────────────────────────────
# Prefix + r reloads ~/.tmux.conf
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
